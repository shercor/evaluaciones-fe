; Ajustes propios del proyecto. Lo que no aparece acá queda como lo deja la
; imagen oficial de PHP.

; De fábrica PHP acepta subidas de 2 MB, y con eso no entra ni una planilla
; de nómina grande ni una foto de teléfono, que pesa entre 3 y 6 MB. nginx ya
; venía aceptando 20 MB (`client_max_body_size`), así que el techo real de
; todo el sistema lo ponía este archivo, que no existía.
upload_max_filesize = 12M
post_max_size = 16M

; Descomprimir un JPEG de 12 megapíxeles ocupa cerca de 50 MB en memoria, y
; para recortarlo hay que tener el original y la copia abiertos a la vez. Con
; 128 MB el proceso muere sin dejar rastro en el registro.
memory_limit = 256M
