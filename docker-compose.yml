services:

  # ---------------------------------------------------------------
  # Frontend Angular en modo desarrollo (ng serve con recarga en vivo)
  # ---------------------------------------------------------------
  angular:
    build:
      context: .
      dockerfile: docker/angular/Dockerfile
      target: dev
    container_name: ep_angular
    working_dir: /app
    volumes:
      - ./frontend:/app
      - angular_node_modules:/app/node_modules
    ports:
      - "${ANGULAR_PORT:-4200}:4200"
    environment:
      NG_CLI_ANALYTICS: "false"
    command: npm start -- --host 0.0.0.0 --port 4200 --poll 1000
    depends_on:
      - nginx

  # ---------------------------------------------------------------
  # Backend Laravel (BFF): PHP-FPM
  # ---------------------------------------------------------------
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ep_php
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

  # ---------------------------------------------------------------
  # Servidor web del backend
  # ---------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: ep_nginx
    ports:
      - "${API_PORT:-8081}:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  # ---------------------------------------------------------------
  # Base de datos propia del BFF
  # ---------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: ep_mysql
    ports:
      - "${DB_PORT_HOST:-3308}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-evaluacion_personal}"
      MYSQL_USER: "${DB_USERNAME:-ep_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    volumes:
      - mysql_data:/var/lib/mysql
      # Bases de los clientes ficticios de prueba. MySQL lo corre solo al
      # crear el volumen por primera vez; en un entorno andando hay que
      # crearlas a mano. El propio archivo lo explica.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------
  # Bandeja de correo para desarrollo. Atrapa TODO lo que se envía y
  # no entrega nada afuera: es la red de seguridad para que un envío
  # a padrón completo no termine en casillas reales.
  #
  # Sin cuota, a diferencia de Mailtrap, que se reserva para el
  # control final de cómo se ve el correo en Gmail y Outlook.
  # ---------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: ep_mailpit
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"   # bandeja web
      - "${MAILPIT_SMTP_PORT:-1025}:1025"  # SMTP
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Worker de colas. Hoy procesa poco; queda levantado desde el
  # inicio para que sumar los avisos por correo sea solo agregar jobs.
  # ---------------------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ep_queue
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: php artisan queue:work --tries=3 --timeout=300 --sleep=3
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

  # ---------------------------------------------------------------
  # Programador de tareas. No hace nada de negocio: es lo que evita
  # que las tablas de servicio —trabajos fallidos, planillas subidas
  # a medias, contraseñas temporales viejas— crezcan para siempre.
  #
  # `schedule:work` se queda mirando el reloj, que es el equivalente
  # en desarrollo del cron que en producción llama a `schedule:run`
  # cada minuto. Qué corre y cada cuánto está en routes/console.php.
  # ---------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ep_scheduler
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: php artisan schedule:work
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  angular_node_modules:
