<h2 class="titulo">Iniciar sesión</h2>

@if (error()) {
  <p class="alert alert-error" role="alert">{{ error() }}</p>
}

<form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
  <div class="field">
    <label for="email">Correo electrónico</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      autocomplete="username"
      [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
    />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <span class="error">Ingresá un correo válido.</span>
    }
  </div>

  <div class="field">
    <label for="password">Contraseña</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
    />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <span class="error">Ingresá tu contraseña.</span>
    }
  </div>

  <label class="recordar">
    <input type="checkbox" formControlName="remember" />
    <span>Mantener la sesión abierta</span>
  </label>

  <button type="submit" class="btn btn-primary ancho" [disabled]="enviando()">
    {{ enviando() ? 'Entrando…' : 'Entrar' }}
  </button>
</form>

<p class="ayuda">
  <a routerLink="/recuperar-contrasena">¿Olvidaste tu contraseña?</a>
</p>
