<div class="grid min-h-screen md:grid-cols-[15rem_minmax(0,1fr)]">
  <!-- Menú lateral -->
  <aside class="border-b border-rule bg-surface px-4 py-6 md:border-r md:border-b-0">
    <div class="mb-4 border-b border-rule px-2.5 pb-5">
      <p class="mb-0.5 text-[0.62rem] font-bold uppercase tracking-[0.15em] text-accent">
        Administración
      </p>
      <p class="text-[0.92rem] font-semibold leading-tight">Evaluación de Personal</p>
    </div>

    <nav>
      <ul class="flex list-none flex-col gap-0.5 p-0">
        @for (item of menu; track item.ruta) {
          <li>
            @if (item.proximamente) {
              <span
                class="flex items-center justify-between gap-2 rounded-md px-2.5 py-2
                       text-sm text-ink-3"
                aria-disabled="true"
              >
                {{ item.etiqueta }}
                <em
                  class="rounded border border-rule px-1.5 py-px text-[0.6rem]
                         not-italic uppercase tracking-wide text-ink-3"
                >Pronto</em>
              </span>
            } @else {
              <a
                class="flex items-center justify-between gap-2 rounded-md px-2.5 py-2
                       text-sm text-ink-2 no-underline transition-colors duration-150
                       hover:bg-surface-2 hover:text-ink"
                [routerLink]="item.ruta"
                routerLinkActive="!bg-accent-soft !text-accent font-semibold"
                [routerLinkActiveOptions]="{ exact: true }"
                >{{ item.etiqueta }}</a
              >
            }
          </li>
        }
      </ul>
    </nav>
  </aside>

  <div class="flex min-w-0 flex-col">
    <header
      class="flex items-center justify-between gap-4 border-b border-rule
             bg-surface px-6 py-3"
    >
      <div class="flex min-w-0 items-center gap-3">
        <span class="avatar-mini" aria-hidden="true">
          {{ user()?.initials }}
        </span>
        <span class="flex min-w-0 flex-col leading-tight">
          <b class="truncate text-sm">{{ user()?.full_name }}</b>
          <em class="text-xs not-italic text-ink-3">{{ user()?.role_label }}</em>
        </span>
      </div>

      <button type="button" class="btn btn-quiet" (click)="salir()" [disabled]="saliendo()">
        {{ saliendo() ? 'Saliendo…' : 'Cerrar sesión' }}
      </button>
    </header>

    <main class="min-w-0 px-6 pt-8 pb-16">
      <app-pending-notice />
      <router-outlet />
    </main>
  </div>
</div>
