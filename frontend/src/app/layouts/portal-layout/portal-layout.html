<header
  class="flex flex-wrap items-center justify-between gap-6 border-b border-rule bg-surface px-4 py-3 sm:px-10"
>
  <div class="flex min-w-0 items-center gap-7">
    <a routerLink="/portal" class="text-[0.95rem] font-semibold !text-ink no-underline">
      Evaluación de Personal
    </a>
    <nav>
      <a
        routerLink="/portal"
        routerLinkActive="!text-accent border-accent font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="border-b-2 border-transparent pb-0.5 text-sm !text-ink-2 no-underline transition-colors duration-150 hover:!text-ink"
        >Mis evaluaciones</a
      >
    </nav>
  </div>

  <div class="flex min-w-0 items-center gap-3">
    <app-avatar [foto]="user()?.avatar_url ?? null" [iniciales]="user()?.initials ?? ''" />
    <span class="hidden min-w-0 flex-col leading-tight sm:flex">
      <b class="truncate text-sm">{{ user()?.full_name }}</b>
      <em class="text-xs not-italic text-ink-3">
        {{ user()?.job_position?.name ?? user()?.role_label }}
      </em>
    </span>
    <div class="flex items-center gap-2">
      <app-selector-tema />
      <button type="button" class="btn btn-quiet" (click)="salir()" [disabled]="saliendo()">
        {{ saliendo() ? 'Saliendo…' : 'Salir' }}
      </button>
    </div>
  </div>
</header>

<main class="mx-auto max-w-5xl px-4 pt-9 pb-16 sm:px-10">
  <app-pending-notice />
  <router-outlet />
</main>
